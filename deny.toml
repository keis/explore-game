[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
skip = [
    "rustc-hash",
    "core-foundation",
    "objc2",
    "objc2-app-kit",
    "objc2-foundation",
    "windows",
    "windows-core",
    "windows-result",
    "windows-sys",
    "toml_edit",
    "libredox",
    "winnow",
    "syn",
    "darling",
    "darling_core",
    "darling_macro",
    "hashbrown",
    "bitflags",
    "downcast-rs",
    "getrandom",
    "linux-raw-sys",
    "miniz_oxide",
    "rustix",
    "thiserror",
    "thiserror-impl",
    "wasi",
    "foldhash",
    "r-efi",
    "redox_syscall",
    "toml_datetime",
    "windows-implement",
    "windows-interface",
    "windows-strings",
    "accesskit_consumer",
    "block2",
    "calloop",
    "calloop-wayland-source",
    "codespan-reporting",
    "mach2",
    "read-fonts",
    "skrifa",
    "smithay-client-toolkit",
