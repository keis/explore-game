name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Blast some junk off the disk
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/graalvm/ /usr/local/.ghcup/ /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android /usr/local/lib/node_modules
        df -h
    - uses: actions/checkout@v7
    - name: Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: clippy
    - uses: rui314/setup-mold@v1
    - name: Install dependencies
      run: |
        sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev clang
    - uses: Leafwing-Studios/cargo-cache@v2
    - name: Test
      run: cargo test
  clippy:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Blast some junk off the disk
      run: |
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/graalvm/ /usr/local/.ghcup/ /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android /usr/local/lib/node_modules
        df -h
    - uses: actions/checkout@v7
    - name: Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: clippy
    - uses: rui314/setup-mold@v1
    - name: Install dependencies
      run: |
        sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev clang
    - uses: Leafwing-Studios/cargo-cache@v2
    - name: Install reviewdog
      run: |
        curl -sfL "https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh" \
          | sh -s -- -b /usr/local/bin/ v0.20.3
    - name: Install clippy-reviewdog-filter
      run: |
        # datasource=github-releases
        curl -sfLJO "https://github.com/keis/clippy-reviewdog-filter/releases/download/v0.1.7/clippy-reviewdog-filter-x86_64-unknown-linux-musl"
        mv clippy-reviewdog-filter-x86_64-unknown-linux-musl /usr/local/bin/clippy-reviewdog-filter
        chmod +x /usr/local/bin/clippy-reviewdog-filter
        clippy-reviewdog-filter --version
    - name: Clippy
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cargo clippy --message-format human --workspace --all-targets
        cargo clippy --message-format json --workspace --all-targets 2>&1 \
          | clippy-reviewdog-filter \
          | reviewdog \
              -f=checkstyle \
              -name=clippy \
              -level=warning \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -fail-on-error=false
