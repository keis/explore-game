[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]

[workspace.dependencies]
bevy_app = "0.18"
bevy_asset = "0.18"
bevy_camera = "0.18"
bevy_derive = "0.18"
bevy_ecs = "0.18"
bevy_hierarchy = "0.18"
bevy_log = "0.18"
bevy_mesh = "0.18"
bevy_reflect = "0.18"
bevy_render = "0.18"
clap = "4.5"
criterion = "0.8"
expl_codex = { version = "0.1.0", path = "crates/expl_codex" }
expl_databinding = { version = "0.1.0", path = "crates/expl_databinding" }
expl_hexagon = { version = "0.1.0", path = "crates/expl_hexagon" }
expl_hexgrid = { version = "0.1.0", path = "crates/expl_hexgrid", features = ["bevy-reflect"] }
expl_map = { version = "0.1.0", path = "crates/expl_map" }
expl_wfc = { version = "0.1.0", path = "crates/expl_wfc" }
glam = "0.30"
itertools = "0.14"
rand = "0.9"
rstest = { version = "0.27", default-features = false }
serde = "1.0"
smallvec = "1.15"
thiserror = ">=1.0.53, <1.1"

[package]
name = "explore_game"
version = "0.1.0"
edition = "2021"
license = "ISC"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

[dependencies]
bevy_asset_loader = "0.26"
bevy-inspector-egui = "0.36"
bevy_mod_billboard = { version = "0.7.0", git = "https://github.com/keis/bevy_mod_billboard.git", rev = "9784800c2ac4fde457f6133a107661a3de31baf6" }
bevy_mod_outline = { version = "0.12" }
bevy_obj = "0.18"
bevy_sprite3d = "8.0"
bevy = { version = "0.18", features = ["wayland", "dynamic_linking", "file_watcher", "track_location"] }
bevy_brp_extras = { version = "0.19.0", optional = true }
bitflags = "2"
clap = { workspace = true, features = ["derive"] }
enum-map = "2.7.3"
expl_codex = { workspace = true }
expl_databinding = { workspace = true }
expl_hexagon = { workspace = true }
expl_hexgrid = { workspace = true }
expl_wfc = { workspace = true }
expl_map = { workspace = true }
futures-lite = "2"
glam.workspace = true
interpolation = "0.3"
itertools = { workspace = true }
leafwing-input-manager = { version = "0.20", features = ["ui", "picking"] }
moonshine-save = "=0.6.1"
moonshine-util = "=0.4.1"
noisy_bevy = "0.13"
pathfinding = "4"
platform-dirs = "0.3"
rand = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
smallvec = { workspace = true }
splines = { features = ["glam"], version = "5" }
thiserror = { workspace = true }
bevy_tweening = "0.15.0"
bevy_mod_stylebuilder = { version = "0.1.3", git = "https://github.com/keis/quill.git", branch = "effects" }
bevy_quill_core = { version = "0.1.3", git = "https://github.com/keis/quill.git", branch = "effects" }
tracing = "0.1.41"

[dev-dependencies]
approx = "0.5"
rstest.workspace = true

[features]
brp = ["bevy_brp_extras", "bevy/png", "bevy/bevy_remote"]
